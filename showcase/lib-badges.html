<!doctype html>
<html lang="en" data-theme="ink">
<head></head>
<body>
    <div class="demo-block" id="components-markers-badges-chips-pill">
      <h2 class="sd-label">Markers, badges, chips, pill</h2>
      <div class="sd-cluster" style="--gap: 18px">
        <span class="sd-cluster" style="--gap: 6px"><span class="sd-dot" data-tone="danger"></span> irreversible</span>
        <span class="sd-cluster" style="--gap: 6px"><span class="sd-dot" data-tone="warning"></span> costly</span>
        <span class="sd-cluster" style="--gap: 6px"><span class="sd-dot" data-tone="pending" data-shape="dashed"></span> unproven</span>
        <span class="sd-cluster" style="--gap: 6px"><span class="sd-dot" data-shape="hollow"></span> routine</span>
        <span class="sd-cluster" style="--gap: 6px"><span class="sd-dot" data-tone="accent" data-shape="hollow"></span> saved</span>
        <span class="sd-cluster" style="--gap: 6px"><span class="sd-dot sd-dot-lg" data-tone="success"></span> large</span>
      </div>
      <div class="sd-cluster">
        <span class="sd-badge" data-tone="danger">Risk</span>
        <span class="sd-badge" data-tone="warning">Costly</span>
        <span class="sd-badge" data-tone="pending">Unproven</span>
        <span class="sd-badge" data-tone="success">Passing</span>
        <span class="sd-badge" data-tone="accent">Active</span>
        <span class="sd-badge">v1.0</span>
        <span class="sd-badge sd-badge-solid" data-tone="danger">Risk</span>
        <span class="sd-badge sd-badge-solid" data-tone="success">Done</span>
      </div>
      <div class="sd-cluster">
        <span class="sd-chip"><b>project</b> Website <button type="button" aria-label="Remove">×</button></span>
        <span class="sd-chip"><b>due</b> this week</span>
        <button class="sd-chip" aria-pressed="true">high risk</button>
        <button class="sd-chip" aria-pressed="false">changes requested</button>
        <button class="sd-pill">↑ <b>21</b> new above <kbd>Shift+N</kbd></button>
      </div>
      <p class="demo-usage"><code>sd-dot</code> + <code>data-shape="hollow|dashed"</code> · <code>sd-badge</code> · <code>sd-badge-solid</code> · <code>sd-chip</code> · <code>sd-pill</code></p>
    </div>
</body>
</html>
