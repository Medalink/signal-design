<a class="sd-skip" href="#main">Skip to content</a>

<!-- Icons: square strokes only. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
{{icons}}
  </defs>
</svg>

<!-- Every library page is a document, like uiarc.dev's docs: a sticky topbar, a fixed filter sidebar on the left, the article, and a sticky on-this-page rail, all on normal page scroll. No app shell, no rain, no statusbar. layout-plugin.js fills this per page. -->
<header class="doc-topbar">
  <button class="sd-btn sd-btn-ghost sd-btn-icon doc-menu-btn" data-doc-nav aria-controls="doc-sidebar" aria-expanded="false" aria-label="Open navigation"><svg><use href="#i-menu"/></svg></button>
  <a href="./index.html" class="sd-wordmark" aria-label="Signal home"><svg class="sd-mark" style="width:22px;height:22px"><use href="#i-mark"/></svg> Signal</a>
  <nav class="doc-crumbs" aria-label="Breadcrumb">
    <ol class="sd-breadcrumb">
          {{crumbs}}
    </ol>
  </nav>
  <div class="doc-topbar-end">
    <button class="sd-btn sd-btn-ghost sd-btn-icon" data-sd-theme-cycle aria-label="Next theme"><svg><use href="#i-theme"/></svg></button>
    <a class="sd-btn sd-btn-ghost sd-btn-icon" href="https://github.com/Medalink/signal-design" target="_blank" rel="noreferrer" aria-label="Signal design on GitHub"><svg><use href="#i-github"/></svg></a>
  </div>
</header>

<div class="doc-sidebar" id="doc-sidebar">
  <div class="doc-sidebar-head">
    <div class="doc-search">
      <input id="doc-filter" type="search" placeholder="Filter pages" aria-label="Filter pages" autocomplete="off">
      <kbd class="doc-search-kbd">Ctrl K</kbd>
    </div>
    <button class="sd-btn sd-btn-ghost sd-btn-icon doc-sidebar-close" data-doc-nav aria-label="Close navigation"><svg><use href="#i-close"/></svg></button>
  </div>
  <nav class="doc-nav" id="doc-nav" aria-label="Library pages">
{{sidebar}}
  </nav>
</div>
<div class="doc-scrim" data-doc-nav-close aria-hidden="true"></div>

<main class="doc-main" id="main" tabindex="-1">
  <div class="doc-grid">
    <article class="doc-article">
{{content}}
    </article>
{{aside}}
  </div>
</main>
