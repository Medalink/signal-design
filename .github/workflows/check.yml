name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:css
      - run: pnpm exec playwright install --with-deps chromium webkit
      - name: Start the showcase
        run: |
          pnpm dev --port 5178 --strictPort > vite.log 2>&1 &
          npx -y wait-on@8.0.3 -t 60000 http-get://localhost:5178/
      - run: node scripts/check.mjs http://localhost:5178/
      - if: failure()
        run: cat vite.log
