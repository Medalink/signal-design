name: check

on:
  push:
    branches: [main]
  pull_request:

# A new push to a pull request supersedes the run in progress.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # WebKit is the slowest engine, so its pages split across two jobs of
        # about equal length. The second takes everything the first does not,
        # so a new page is checked without editing this list.
        include:
          - suite: chromium
            browser: chromium
            args: --engine chromium
          - suite: webkit 1/2
            browser: webkit
            args: --engine webkit --only components,charts,form,standalone
          - suite: webkit 2/2
            browser: webkit
            args: --engine webkit --except components,charts,form,standalone
          - suite: a11y
            browser: chromium
    env:
      BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ matrix.suite == 'chromium' && github.event_name == 'pull_request' && '0' || '1' }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p 'require("playwright/package.json").version')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.pw.outputs.version }}-${{ env.BROWSER }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps ${{ env.BROWSER }}
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps ${{ env.BROWSER }}
      - run: pnpm build:css
      - name: Start the showcase
        run: |
          pnpm dev --port 5178 --strictPort > vite.log 2>&1 &
          npx -y wait-on@8.0.3 -t 60000 http-get://localhost:5178/

      - name: Pull request leaves generated and shared files alone
        if: matrix.suite == 'chromium' && github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release/')
        run: |
          touched=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- CHANGELOG.md ai/components.json ai/tokens.json llms-full.txt vscode/html-data.json vscode/css-data.json)
          if [ -n "$touched" ]; then
            echo "::error::Do not commit these in a pull request: $touched"
            echo "Generated files are rebuilt on main by the ai-files workflow; changelog entries go in changes/ (see CONTRIBUTING.md)."
            echo "To drop them: git checkout origin/${{ github.base_ref }} -- $touched"
            exit 1
          fi
      - name: Changelog fragments are well formed
        if: matrix.suite == 'chromium'
        run: node scripts/changelog.mjs --check
      - name: AI files build
        if: matrix.suite == 'chromium'
        run: node scripts/build-ai.mjs

      - if: matrix.suite != 'a11y'
        run: node scripts/check.mjs http://localhost:5178/ ${{ matrix.args }}
      - if: matrix.suite == 'a11y'
        run: node scripts/a11y.mjs http://localhost:5178/
      - if: failure()
        run: cat vite.log
