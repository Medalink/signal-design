name: pages

# Serves the showcase at https://medalink.github.io/signal-design/ from main.
# The showcase is built as a static site (vite) with asset URLs rewritten for
# the /signal-design/ subpath via SHOWCASE_BASE.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The deploy job runs in 44 seconds to 2.4 minutes; 8 leaves room for one
    # deploy-pages retry.
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:showcase
        env:
          SHOWCASE_BASE: /signal-design/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .showcase-dist
      # deploy-pages has hit GitHub's artifact-metadata API returning 0 artifacts
      # for an artifact that is present (run 44463953127). One retry after a short
      # wait rides out the race; a longer GitHub outage still fails the run.
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deployment.outcome == 'failure'
        run: sleep 20
      - id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
