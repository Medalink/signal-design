name: ai-files

# Regenerates the files AI tools and editors read (scripts/build-ai.mjs) after
# every push to main and commits them when they changed. Pull requests do not
# commit these files, so two pull requests never conflict on them.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # A newer push cancels the run in progress instead of queueing behind it:
  # the queued run would build the same tip the newer run builds, so only
  # the newest one needs to finish. Bot commits (GITHUB_TOKEN) start no
  # workflow, so a regeneration never cancels itself.
  group: ai-files
  cancel-in-progress: true

jobs:
  regenerate:
    runs-on: ubuntu-latest
    # The job runs in about 45 seconds with the browser cache below.
    timeout-minutes: 3
    steps:
      # The current tip of main, not the commit that triggered this run: the
      # one run that survives a newer push builds the tip.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p 'require("playwright/package.json").version')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.pw.outputs.version }}-chromium
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - name: Regenerate and commit when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # When main moves between the build and the push, start over from the
          # new tip rather than rebasing a regeneration of an older tree.
          for attempt in 1 2 3; do
            git fetch -q origin main
            git reset -q --hard origin/main
            pnpm build:css
            node scripts/build-ai.mjs
            git add ai/components.json ai/tokens.json llms-full.txt vscode/html-data.json vscode/css-data.json
            if git diff --cached --quiet; then echo "AI files unchanged."; exit 0; fi
            git commit -q -m "Regenerate AI files"
            if git push origin HEAD:main; then exit 0; fi
            echo "main moved; regenerating from the new tip."
          done
          echo "::error::Could not push regenerated AI files after 3 attempts"
          exit 1
