name: ai-files

# Regenerates the files AI tools and editors read (scripts/build-ai.mjs) after
# every push to main and commits them when they changed. Pull requests do not
# commit these files, so two pull requests never conflict on them.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-files
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:css
      - run: pnpm exec playwright install --with-deps chromium
      - run: node scripts/build-ai.mjs
      - name: Commit when changed
        run: |
          git add ai/components.json ai/tokens.json llms-full.txt vscode/html-data.json vscode/css-data.json
          if git diff --cached --quiet; then echo "AI files unchanged."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Regenerate AI files"
          git pull --rebase origin main
          git push origin HEAD:main
